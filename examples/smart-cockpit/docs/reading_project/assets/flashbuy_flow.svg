<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="704" viewBox="0 0 1120 704" role="img" aria-labelledby="title">
<title id="title">闪购怎样保留预览与确认边界？</title>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4277b6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7766b0"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#288b7c"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#758294"/></marker><style>
text {font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#243248}
.heading{font-size:30px;font-weight:650} .subtitle{font-size:19px;fill:#607086}
.node-title{font-size:24px;font-weight:600} .body{font-size:18px;fill:#4d6077}
.tag{font-size:15px;font-weight:600} .label{font-size:18px;font-weight:550;text-anchor:middle}
.small{font-size:17px;fill:#607086} .edge{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
</style></defs>
<rect width="1120" height="704" fill="#fff"/>
<text x="48" y="53" class="heading" >闪购怎样保留预览与确认边界？</text>
<text x="48" y="88" class="subtitle" >每次调用表达当前动作；购物状态由同一份 Service 状态承接。</text>

<path class="edge" d="M456 228H664" stroke="#4277b6"  marker-end="url(#arrow-blue)"/>
<rect x="491.0" y="182" width="138" height="31" rx="6" fill="#fff"/>
<text x="560" y="205" class="label" >当前购买意图</text>
<path class="edge" d="M868 298V420" stroke="#7766b0"  marker-end="url(#arrow-purple)"/>
<rect x="799.0" y="340" width="138" height="31" rx="6" fill="#fff"/>
<text x="868" y="363" class="label" >用户后续确认</text>
<path class="edge" d="M664 496H456" stroke="#288b7c"  marker-end="url(#arrow-teal)"/>
<rect x="504.0" y="450" width="112" height="31" rx="6" fill="#fff"/>
<text x="560" y="473" class="label" >条件通过</text>
<g data-card="搜索与选择商品"><rect x="48" y="152" width="408" height="146" rx="16" fill="#f1f7fd" stroke="#b9d0e9"/>
<text x="72" y="180" class="tag" fill="#4277b6">01  后台模型 + Service</text>
<text x="72" y="213" class="node-title" >搜索与选择商品</text>
<text x="72" y="246" class="body" >浏览示例目录，返回候选</text>
<text x="72" y="274" class="body" >保留当前商品与用户选择</text>
</g>
<g data-card="加购并生成预览"><rect x="664" y="152" width="408" height="146" rx="16" fill="#eff8f5" stroke="#badace"/>
<text x="688" y="180" class="tag" fill="#288b7c">02  本次任务可以完成</text>
<text x="688" y="213" class="node-title" >加购并生成预览</text>
<text x="688" y="246" class="body" >整理商品、数量、费用与地址</text>
<text x="688" y="274" class="body" >等待确认，此时尚未生成订单</text>
</g>
<g data-card="后续确认动作"><rect x="664" y="420" width="408" height="146" rx="16" fill="#f6f3fc" stroke="#d0c4e7"/>
<text x="688" y="448" class="tag" fill="#7766b0">03  业务阶段边界</text>
<text x="688" y="481" class="node-title" >后续确认动作</text>
<text x="688" y="514" class="body" >用户明确确认后发起新任务</text>
<text x="688" y="542" class="body" >Service 检查预览与确认参数</text>
</g>
<g data-card="生成模拟订单"><rect x="48" y="420" width="408" height="146" rx="16" fill="#eff8f5" stroke="#badace"/>
<text x="72" y="448" class="tag" fill="#288b7c">04  订单状态</text>
<text x="72" y="481" class="node-title" >生成模拟订单</text>
<text x="72" y="514" class="body" >记录订单并清空购物车与预览</text>
<text x="72" y="542" class="body" >界面与语音呈现业务结果</text>
</g>
<path d="M48 610H1072" stroke="#e2e8f0"/>
<text x="48" y="641" class="small" >模型提示词指导尊重确认，Service 检查订单状态与明确确认参数。</text>
<text x="48" y="668" class="small" >当前为模拟订单，真实平台授权、支付与交易幂等仍需集成。</text>
</svg>